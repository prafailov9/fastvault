# who am I
device.name=windows
vault.root=D:\vault\shared
listen.port=8765

# who else exists (devices with listeners)
address.mac=192.168.1.20:8765     # or pc-name.local:8765

# devices without listeners get a mailbox
mailbox.iphone=pc

# behavior
scan.seconds=5
archive=sent                      # sent | delete

# The PC's file mirrors it: device.name=pc, address.mac=..., 
# same mailbox.iphone=pc (making the PC recognize itself as the mailbox). 
# The set of known devices = self + every address.* + every mailbox.* key — that's what the listener validates to= against.